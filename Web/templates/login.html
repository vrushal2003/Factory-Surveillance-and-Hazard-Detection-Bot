<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Bot — Login</title>
<style>
:root {
  --bg:      #0b0d11;
  --surface: #13161e;
  --card:    #181c27;
  --border:  #252a38;
  --accent:  #00e5a0;
  --danger:  #ef4444;
  --text:    #dde3f0;
  --muted:   #5a6380;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: 'Courier New', monospace;
  display: flex; align-items: center; justify-content: center;
}
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 32px; width: 320px;
}
.logo {
  color: var(--accent); font-size: 16px; font-weight: 700; letter-spacing: 3px;
  text-align: center; margin-bottom: 4px;
}
.logo em { color: var(--muted); font-style: normal; font-weight: 400; }
.sub {
  color: var(--muted); font-size: 11px; letter-spacing: 1px; text-align: center;
  margin-bottom: 24px; text-transform: uppercase;
}
label {
  display: block; font-size: 10px; letter-spacing: 1.5px; color: var(--muted);
  text-transform: uppercase; margin-bottom: 6px;
}
input {
  width: 100%; padding: 10px 12px; margin-bottom: 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-family: inherit; font-size: 14px;
}
input:focus { outline: none; border-color: var(--accent); }
button {
  width: 100%; padding: 10px; background: var(--accent); color: #000;
  border: none; border-radius: 6px; font-weight: 700; font-size: 13px;
  letter-spacing: 1px; font-family: inherit; cursor: pointer;
}
button:hover { opacity: 0.85; }
.error {
  background: rgba(239,68,68,.1); border: 1px solid var(--danger); color: #ffb3b3;
  padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 16px;
}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">FACTORY<em>BOT</em></div>
    <div class="sub">Control Center · Sign In</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST" action="/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
